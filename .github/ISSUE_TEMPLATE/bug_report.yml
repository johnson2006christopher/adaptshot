name: Bug report
description: Something in AdaptShot behaves incorrectly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Reproducibility is a core
        AdaptShot value — the more precisely you can pin the failure, the faster it gets fixed.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem. Include the seed you used.
      render: python
      placeholder: |
        from src.adaptshot import AdaptShotConfig, FewShotLearner
        from src.adaptshot.utils.determinism import set_deterministic_seed

        set_deterministic_seed(42)
        learner = FewShotLearner(config=AdaptShotConfig(backbone="resnet18", device="cpu"))
        ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AdaptShot version
      description: "Output of: python -c \"import adaptshot; print(adaptshot.__version__)\""
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version and OS
      placeholder: "3.11.9 on Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: extras
    attributes:
      label: Which optional extras are installed?
      multiple: true
      options:
        - none (core only)
        - torch
        - faiss
        - ui
        - gui
        - dev
    validations:
      required: true

  - type: checkboxes
    id: determinism
    attributes:
      label: Determinism check
      options:
        - label: The failure reproduces on a fresh run with the same seed
        - label: I am running on CPU (AdaptShot is CPU-first; GPU paths are optional)

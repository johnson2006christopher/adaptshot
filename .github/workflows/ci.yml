name: CI

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main, "v*" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches mypy's `python_version` in pyproject.toml, so the interpreter
          # that resolves third-party stubs and the version mypy analyses for are
          # the same. A mismatch there is a slow way to learn about stub drift.
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        # The torch extra is needed for the type check, not the lint. torch ships
        # py.typed, so installing it lets mypy verify our torch calls against the
        # real signatures instead of treating the whole library as Any. Without it
        # mypy stops at the unresolved import and checks nothing (#16).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torch]"
          pip install -e "apps/tambua[dev]"
      - name: Materialise gradio's event-listener stubs
        # gradio attaches .click()/.change() to components dynamically, in a
        # metaclass, and writes the matching .pyi files into site-packages the
        # first time it is imported. Those files are NOT in the wheel. mypy reads
        # files, not metaclasses, so on a fresh install it reports
        # `"Button" has no attribute "click"` -- and whether it does depends on
        # whether anything happened to import gradio earlier in the job, which
        # made this check silently non-hermetic.
        #
        # Import once, deliberately, then assert a stub actually landed, so a
        # change in gradio's behaviour fails here with a clear message instead of
        # surfacing as confusing attr-defined errors in our own code.
        run: |
          python - <<'PY'
          import pathlib
          import gradio
          stub = pathlib.Path(gradio.__file__).parent / "components" / "button.pyi"
          if not stub.is_file():
              raise SystemExit(
                  f"gradio no longer generates {stub} on import. The strict type "
                  "check below will report spurious attr-defined errors on every "
                  "event handler until this is re-solved."
              )
          print(f"gradio stubs generated: {stub}")
          PY
      - name: Lint with ruff
        run: ruff check src/ tests/ benchmarks/ apps/ examples/
      - name: Type check with mypy (strict)
        run: mypy src/adaptshot --strict
      - name: Type check the application (strict)
        # A separate invocation: the app is its own distribution, and mypy should
        # resolve `adaptshot` through the install rather than the source tree.
        run: mypy apps/tambua/src/tambua --strict

  # The full suite. Needs the torch extra: two test modules and the benchmark
  # exercise torch-backed paths directly. See #33.
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Target range is 3.10-3.14 (#34). 3.13 and 3.14 have never been tested;
        # the dependency floors (numpy>=1.24, Pillow>=9) and the torch extra may
        # not reach the top of this range. Failures here are the evidence #34 needs
        # before pyproject.toml claims support.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,torch]"
          # The application is a separate distribution. Installing it here is what
          # makes apps/tambua/tests meaningful -- they assert that `tambua` resolves
          # by installation, not by happening to sit under the working directory.
          pip install -e "apps/tambua[dev]"
      - name: Test with pytest
        run: pytest tests/ -v --tb=short --cov=src/adaptshot --cov-report=xml --cov-report=term-missing
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # The job that turns "torch is optional" from a README sentence into a tested
  # property. Installs ONLY the core extra -- numpy, Pillow, and the dev tools.
  #
  # KNOWN RED: this currently fails with 14 errors, because inference itself requires
  # torch -- `predict`, `correct`, and save/load all reach `torch.nn` (#35). That
  # contradicts README.md:100 ("PyTorch is optional and needed only for training").
  # `continue-on-error` is here so the failure stays VISIBLE while #35 is decided,
  # rather than being hidden by narrowing what this job runs.
  # REMOVE `continue-on-error` when #35 is resolved. It is a marker, not a soft-fail.
  test-core:
    name: Tests (core install, no torch)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies (no torch extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Assert torch really is absent
        # Guards against a transitive dependency quietly pulling torch in, which
        # would make this job pass without testing anything it claims to test.
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("torch") is not None:
              sys.exit("torch is installed in the core-only job; it no longer proves anything")
          print("confirmed: torch is not installed")
          PY
      - name: Test with pytest
        run: pytest tests/ -v --tb=short -rs

  # Proves the claim in #12: the documented validation gate runs with no network
  # at all. It uses the synthetic fixture, so it reports determinism and latency
  # and deliberately no accuracy -- a figure measured on random tensors would
  # describe nothing.
  #
  # No pip cache and no dataset cache here on purpose: a cache is a form of
  # network access that already happened, and this job exists to prove the run
  # needs neither.
  benchmark-offline:
    name: Smoke benchmark (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Assert the CPU-only build is what we are testing
        # The default PyPI index serves the CUDA build on Linux, which pulled in
        # ~2-3GB of nvidia-* wheels to run a job named "CPU-only" (#60). CPU-only
        # is this project's first constraint; it should be verified, not assumed.
        run: |
          python - <<'PY'
          import sys
          import torch
          if torch.version.cuda:
              sys.exit(f"CUDA-enabled torch ({torch.version.cuda}) in a CPU-only job")
          print(f"confirmed: CPU-only torch {torch.__version__}")
          PY
      - name: Verify the namespace really has no network
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # so a plain `unshare -rn` fails with
        # "write failed /proc/self/uid_map: Operation not permitted".
        # Lifting the restriction is the documented workaround on these runners.
        #
        # Then prove the isolation before relying on it. A namespace that
        # silently failed to isolate would make the step below pass while
        # demonstrating nothing, which is worse than not having the job.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -rn python - <<'PY'
          import socket
          import sys
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=5)
          except OSError as exc:
              print(f"confirmed: no network inside the namespace ({type(exc).__name__})")
          else:
              sys.exit("the namespace did not isolate; the offline proof would be vacuous")
          PY
      - name: Run the smoke benchmark with networking disabled
        # An empty network namespace: no interface but loopback. If anything
        # reaches for the network, it fails here rather than on a contributor's
        # connection.
        run: |
          unshare -rn python -m benchmarks.run_benchmark \
            --smoke-test --seed 42 --output results/offline_smoke.json
      - name: Assert it really ran offline, on the fixture
        run: |
          python - <<'PY'
          import json
          import sys
          with open("results/offline_smoke.json", encoding="utf-8") as handle:
              results = json.load(handle)
          if results["data_source"] != "synthetic":
              sys.exit(f"expected the offline fixture, got {results['data_source']!r}")
          if results["accuracy"] is not None:
              sys.exit("an accuracy figure was published from synthetic data")
          print(f"offline run OK: {results['latency_avg_ms']:.1f} ms average latency")
          PY

  benchmark:
    name: Deterministic smoke benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache the CIFAR-10 download
        # Measured on this runner: the download took 34m48s while the benchmark
        # itself took 56s -- 97% of the job was waiting for cs.toronto.edu, which
        # served roughly 80KB/s. The dataset never changes, so fetch it once.
        uses: actions/cache@v4
        with:
          path: ./data
          key: cifar10-v1
      - name: Install dependencies (CPU-only torch)
        # benchmarks/run_benchmark.py imports torch at module scope and loads
        # ResNet-18 via torchvision. The CPU index is deliberate: see #60.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Assert the CPU-only build is what we are testing
        run: |
          python - <<'PY'
          import sys
          import torch
          if torch.version.cuda:
              sys.exit(f"CUDA-enabled torch ({torch.version.cuda}) in a CPU-only job")
          print(f"confirmed: CPU-only torch {torch.__version__}")
          PY
      - name: Run CPU-only smoke benchmark
        # --allow-download so a cold cache still produces the measured CIFAR-10
        # figure rather than silently falling back to the fixture.
        run: |
          python -m benchmarks.run_benchmark \
            --smoke-test --dataset cifar10 --allow-download --seed 42

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tambua"
version = "0.1.0"
description = "Few-shot image classification with a human in the loop — teach it five examples, it identifies the rest"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Johnson Christopher Hassan", email = "johnson2006christopher@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# `adaptshot` is a dependency, not a sibling directory. This application resolves
# it exactly as any third-party user would -- which is what makes "built on
# AdaptShot" a fact about the code rather than a claim in a README.
dependencies = [
    "adaptshot>=0.2.0",
    "gradio>=3.50.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10",
    "mypy>=1.5.0,<3",
    "ruff>=0.16.0,<0.17",
]

[project.scripts]
tambua = "tambua.app:launch"

[project.urls]
Homepage = "https://github.com/johnson2006christopher/adaptshot"
"Bug Tracker" = "https://github.com/johnson2006christopher/adaptshot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tambua" = ["py.typed"]

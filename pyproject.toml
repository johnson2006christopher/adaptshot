[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptshot"
version = "0.1.2"
description = "Human-aligned few-shot vision learning for resource-constrained environments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Johnson Christopher Hassan", email = "johnson2006christopher@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0", "torchvision>=0.15.0"]
faiss = ["faiss-cpu>=1.7.4"]
ui = ["gradio>=3.50.0"]
gui = ["gradio>=3.50.0", "pandas>=2.0.0", "onnx>=1.16.0", "onnxscript>=0.3.0", "onnxruntime>=1.14.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
]
all = ["adaptshot[torch,faiss,gui,dev]"]

[project.scripts]
adaptshot-studio = "adaptshot.studio.app:launch"

[project.urls]
Homepage = "https://github.com/johnson2006christopher/adaptshot"
Documentation = "https://github.com/johnson2006christopher/adaptshot/docs"
Repository = "https://github.com/johnson2006christopher/adaptshot.git"
"Bug Tracker" = "https://github.com/johnson2006christopher/adaptshot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adaptshot" = ["data/*.onnx", "data/*.onnx.data"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "torchvision.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "onnxruntime"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Uncomment if pytest-cov is installed:
# addopts = "--cov=src/adaptshot --cov-report=term-missing"
site_name: AdaptShot
site_description: Human-aligned few-shot vision learning for resource-constrained environments
site_url: https://johnson2006christopher.github.io/adaptshot
repo_url: https://github.com/johnson2006christopher/adaptshot
repo_name: johnson2006christopher/adaptshot
docs_dir: docs
site_dir: site
# Built and reachable by URL, but deliberately unlinked: these are historical
# records of v0.1.1, not current documentation. See the banner at the top of each.
not_in_nav: |
  archive/audit-report-v0.1.1.md
  release-checklist-v0.1.1.md

theme:
  name: material
  logo: images/adaptshot-logo.png
  favicon: images/adaptshot-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google

validation:
  nav:
    omitted_files: warn
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - Technical Note: technical-note.md
  - Getting Started:
    - Beginner 101: getting-started/beginner-101.md

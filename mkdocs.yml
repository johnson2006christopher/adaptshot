site_name: AdaptShot
site_description: Human-aligned few-shot vision learning for resource-constrained environments
site_url: https://johnson2006christopher.github.io/adaptshot
repo_url: https://github.com/johnson2006christopher/adaptshot
repo_name: johnson2006christopher/adaptshot
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Tutorials: tutorials.md
    - Benchmarks: getting-started/benchmarks.md
  - API Reference:
    - Core Engine: api/core.md
    - Training & Continual Learning: api/training.md
    - Configuration & Utils: api/config.md
  - v0.1.1 Docs Roadmap: v0.1.1-docs-roadmap.md
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md
  - Changelog: changelog.md

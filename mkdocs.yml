site_name: AdaptShot
site_description: Human-aligned few-shot vision learning for resource-constrained environments
site_url: https://johnson2006christopher.github.io/adaptshot
repo_url: https://github.com/johnson2006christopher/adaptshot
repo_name: johnson2006christopher/adaptshot
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: images/adaptshot-logo.png
  favicon: images/adaptshot-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Benchmarks: getting-started/benchmarks.md
  - Tutorials:
    - Tutorial Index: tutorials.md
    - 01 Getting Started: tutorials/01_getting_started.md
    - 02 Human in the Loop: tutorials/02_human_in_the_loop.md
    - 03 Continual Learning: tutorials/03_continual_learning.md
    - 04 Production Ready: tutorials/04_production_ready.md
    - 05 Reference FAQ: tutorials/05_reference_faq.md
    - 06 Core API Deep Dive: tutorials/06_core_api_deep_dive.md
    - 07 Source Tour: tutorials/07_source_tour.md
    - 08 Configuration, Determinism, and Safe I/O: tutorials/08_configuration_determinism_io.md
    - 09 Benchmarks and Reproducibility: tutorials/09_benchmarks_and_reproducibility.md
    - 10 Module Map: tutorials/10_module_map.md
    - 11 UI Pilot Dashboard: tutorials/11_ui_pilot_dashboard.md
  - API Reference:
    - Core Engine: api/core.md
    - Training & Continual Learning: api/training.md
    - Configuration & Utils: api/config.md
  - v0.1.1 Docs Roadmap: v0.1.1-docs-roadmap.md
  - Contributing: contributing.md
  - Code of Conduct: code_of_conduct.md
  - Changelog: changelog.md

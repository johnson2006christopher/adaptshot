site_name: AdaptShot
site_description: Human-aligned few-shot vision learning for resource-constrained environments
site_url: https://johnson2006christopher.github.io/adaptshot
repo_url: https://github.com/johnson2006christopher/adaptshot
repo_name: johnson2006christopher/adaptshot
edit_uri: edit/v0.3.0/docs/
docs_dir: docs
site_dir: site
# Built and reachable by URL, but deliberately unlinked: these are historical
# records of v0.1.1, not current documentation. See the banner at the top of each.

theme:
  name: material
  logo: images/adaptshot-logo.png
  favicon: images/adaptshot-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
    - What AdaptShot is: tutorials/00-what-is-this.md
    - 1. Install: tutorials/01-install.md
    - 2. Your first prediction: tutorials/02-first-prediction.md
    - 3. Your own photographs: tutorials/03-your-own-photos.md
    - 4. Reading the answer: tutorials/04-reading-the-answer.md
    - 5. Teaching corrections, saving: tutorials/05-teaching-corrections.md
    - Where next: tutorials/06-next.md
  - How-to guides:
    - Run the demo offline: how-to/run-the-offline-demo.md
    - Check what a machine can do: how-to/check-what-this-machine-can-do.md
    - Choose the promise level (α): how-to/choose-alpha.md
    - Save, load and migrate: how-to/save-load-and-migrate.md
    - Fine-tune from corrections: how-to/fine-tune-with-corrections.md
    - Use a different backbone: how-to/use-your-own-backbone.md
    - Export a backbone to ONNX: how-to/export-a-backbone-to-onnx.md
    - Run the benchmarks: how-to/run-the-benchmarks.md
    - Use Tambua: how-to/use-tambua.md
    - Deploy offline: how-to/deploy-offline.md
    - Troubleshoot: how-to/troubleshoot.md
  - Understand:

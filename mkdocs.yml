    - Why CPU-only and offline: understand/why-cpu-only-and-offline.md
    - Human in the loop: understand/human-in-the-loop.md
    - Algorithm theory: understand/algorithm-theory.md
    - Illustrative use cases: understand/real-world-use-cases.md
